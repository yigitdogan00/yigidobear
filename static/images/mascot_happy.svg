  <!-- Ocean Blue Bow Tie -->
  <polygon points="52,70 60,73 52,76" fill="#0284c7"/>
  <polygon points="68,70 60,73 68,76" fill="#0284c7"/>
  <circle cx="60" cy="73" r="3" fill="#0ea5e9"/>
