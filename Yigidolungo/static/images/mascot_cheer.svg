<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Celebration Sparkles -->
  <polygon points="16,18 19,26 27,29 19,32 16,40 13,32 5,29 13,26" fill="#38bdf8"/>
  <polygon points="104,18 107,26 115,29 107,32 104,40 101,32 93,29 101,26" fill="#f59e0b"/>
  <circle cx="28" cy="16" r="3" fill="#f59e0b"/>
  <circle cx="92" cy="16" r="3" fill="#38bdf8"/>

  <!-- Shadow -->
  <ellipse cx="60" cy="112" rx="36" ry="6" fill="#0284c7" opacity="0.15"/>

  <!-- Left Ear -->
  <circle cx="34" cy="32" r="14" fill="#b46a32"/>
  <circle cx="34" cy="32" r="8" fill="#fbcfe8"/>

  <!-- Right Ear -->
  <circle cx="86" cy="32" r="14" fill="#b46a32"/>
  <circle cx="86" cy="32" r="8" fill="#fbcfe8"/>

  <!-- Body -->
  <ellipse cx="60" cy="78" rx="38" ry="34" fill="#c97a3e"/>
  <!-- Tummy -->
  <ellipse cx="60" cy="82" rx="24" ry="22" fill="#fed7aa"/>

  <!-- Feet -->
  <ellipse cx="44" cy="108" rx="10" ry="7" fill="#b46a32"/>
  <ellipse cx="76" cy="108" rx="10" ry="7" fill="#b46a32"/>
  <circle cx="44" cy="107" r="4" fill="#fed7aa"/>
  <circle cx="76" cy="107" r="4" fill="#fed7aa"/>

  <!-- Head -->
  <circle cx="60" cy="50" r="32" fill="#c97a3e"/>

  <!-- Muzzle -->
  <ellipse cx="60" cy="59" rx="16" ry="13" fill="#fed7aa"/>
  <!-- Nose -->
  <path d="M 55,53 C 55,51 65,51 65,53 C 65,57 60,60 60,60 C 60,60 55,57 55,53 Z" fill="#451a03"/>
  
  <!-- Happy Open Laughing Mouth -->
  <path d="M 54,61 Q 60,72 66,61 Z" fill="#f43f5e"/>
  <path d="M 56,66 Q 60,70 64,66" fill="#fda4af"/>

  <!-- Rosy Cheeks -->
  <circle cx="36" cy="57" r="7" fill="#f43f5e" opacity="0.4"/>
  <circle cx="84" cy="57" r="7" fill="#f43f5e" opacity="0.4"/>

  <!-- Happy Curved Eyes (Joyful ^ ^) -->
  <path d="M 40,46 Q 46,38 52,46" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 68,46 Q 74,38 80,46" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Left Arm: Thumbs Up (Başparmak Yukarı) -->
  <ellipse cx="22" cy="62" rx="7" ry="14" fill="#b46a32" transform="rotate(-30 22 62)"/>
  <!-- Thumbs Up Paw Graphic -->
  <circle cx="16" cy="52" r="7" fill="#b46a32"/>
  <ellipse cx="16" cy="46" rx="4" ry="6" fill="#b46a32" transform="rotate(-15 16 46)"/>
  <circle cx="16" cy="52" r="4" fill="#fed7aa"/>

  <!-- Right Arm: Raised Paw in Air -->
  <ellipse cx="98" cy="62" rx="7" ry="14" fill="#b46a32" transform="rotate(30 98 62)"/>
  <circle cx="104" cy="52" r="7" fill="#b46a32"/>
  <circle cx="104" cy="52" r="4" fill="#fed7aa"/>

  <!-- Ocean Blue Bow Tie -->
  <polygon points="52,69 60,72 52,75" fill="#0284c7"/>
  <polygon points="68,69 60,72 68,75" fill="#0284c7"/>
  <circle cx="60" cy="72" r="3.2" fill="#38bdf8"/>
</svg>
